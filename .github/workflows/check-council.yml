name: Check Council view
on:
  pull_request:
    paths:
      - 'members/**'
      - 'scripts/**'
      - '.github/workflows/check-council.yml'
  push:
    branches: [main]
    paths:
      - 'members/**'
      - 'scripts/**'
      - '.github/workflows/check-council.yml'
permissions:
  contents: read
jobs:
  council:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/render_council.py --check
