# purpose: Execute the trusted main onboarding script; never execute PR code.
# triggers: main push, hourly at minute 17 UTC, manual dry-run/apply.
# inputs: dry_run is boolean, defaults true; false requires ENABLED=true.
# environment: onboarding, restricted to main (branches only, no tags).
# variables: ONBOARDING_APP_CLIENT_ID, ONBOARDING_START_AT (UTC ISO 8601),
#            ONBOARDING_ENABLED (literal true/false, default false).
# secret: ONBOARDING_APP_PRIVATE_KEY (PEM). Never store it in this file.
# validation: actionlint; python unittest tests use mocked HTTP, no invitations.
name: Sync onboarding
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read only; no invitations or PR comments'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: onboarding-sync
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.repository == 'AI-Native-Global-Founders-Speedrun-TW/ai-native-founders-tw-mono'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: onboarding
    steps:
      - name: Decide whether to run
        id: gate
        env:
          ENABLED: ${{ vars.ONBOARDING_ENABLED }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" = true ]; then
            echo 'mode=--dry-run' >> "$GITHUB_OUTPUT"
          elif [ "$ENABLED" = true ]; then
            echo 'mode=--apply' >> "$GITHUB_OUTPUT"
          else
            echo 'Onboarding disabled; no credentials loaded.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.gate.outputs.mode != ''
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.mode != ''
        with:
          python-version: '3.12'
      - name: Install dependency
        if: steps.gate.outputs.mode != ''
        run: python -m pip install -r scripts/requirements.txt
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        if: steps.gate.outputs.mode != ''
        id: app
        with:
          client-id: ${{ vars.ONBOARDING_APP_CLIENT_ID }}
          private-key: ${{ secrets.ONBOARDING_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ai-native-founders-tw-mono
      - name: Reconcile onboarding
        if: steps.gate.outputs.mode != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ONBOARDING_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          ONBOARDING_START_AT: ${{ vars.ONBOARDING_START_AT }}
          ONBOARDING_ENABLED: ${{ vars.ONBOARDING_ENABLED }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: python -m scripts.排程.入會權限處理.process_onboarding "$MODE"
