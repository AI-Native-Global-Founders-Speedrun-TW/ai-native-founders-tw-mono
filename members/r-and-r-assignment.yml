# =============================================================================
# R&R assignment — 格式、欄位與驗證規範
# =============================================================================
# 規則來源（repo 根起算）：specs/01-制度/[規格]成員識別與資料.md
# purpose: 唯一的人員分工資料；每項 R&R 同時列出 Leader 與 Contributors。
# Verify note：Council 必須至少擔任一項有效的 R&R Leader。
# council: 先依原案核對有效任職，再將有效 leader 依同人去重；有值不證明已生效。
#          不另外手填或產生 Council 名單。
#
# structure:
#   root: mapping，只允許必填的 assignments。
#   assignments: sequence，列出全部現行 R&R；每項 role 恰好一筆。
#   assignments[]: mapping，只允許 role、leader、contributors；三者皆必填。
#   role: 非空 string；沿用 specs/02-R&R/README.md 文件入口的 R&R 名稱。
#   leader: 個人成員路徑 string 或 null；不得用空字串、清單或省略欄位。
#   contributors: 個人成員路徑 string 的 sequence；無人時寫 []，不得為 null。
#   member_path: repo 根起算的 members/ 下現有個人成員 Markdown 路徑；
#                不用 URL、絕對路徑或 ..；同一人一份檔案，不重抄姓名或 Member ID。
#
# example: 以下是假設格式，不是真實任命。
#   assignments:
#     - role: Hacker
#       leader: null
#       contributors:
#         - members/example.md
#
# validation:
#   syntax: 單一 YAML 文件，空格縮排，不用 Tab，不允許重複 key。
#   fields: 檢查所有必填 key、上述型別與非空限制，不加狀態、日期或證據欄位。
#   roles: 與既有 R&R 入口逐項對照，不漏列、不重複、不新增未成立職責。
#   people: 每個路徑存在且對應本人；同一 role 的 contributors 不重複。
#           同一人可出現在多項 role，也可同時為 Leader 與 Contributor。
#   validity: 對照原 PR／Issue 的有效資格與本人選擇；Leader 另須有效任命、
#             本人接受及生效依據。格式正確不表示已任職；pending 檔名不裁定資格。
#   participation: 每位正式成員至少自行選一項 Contributors，Leader 也一樣；
#                  不從 leader 自動補入 contributors，不把選擇分工當成承接所有工作。
#   method: python -m scripts.驗證.分工資料.validate；PR 與 main CI 執行相同驗證及測試。
#           程式檢查語法、欄位、引用與重複；資格、本人接受及任命效力仍由人核對。
#
# discord_mapping: leader 路徑 → 個人成員檔案「成員資料」的選填 discord_id。
#                  未取得對應時省略或 null；登錄值為加引號的數字字串，不證明控制權。
#                  不在本檔重抄 ID；對應及派發角色須另核對本人、有效任職與伺服器成員。
#
# maintenance:
#   - null 表示尚無已登錄的 Leader；不得因本輪尚未核對完證據而清空既有姓名。
#   - 格式遷移保留既有 Leader 對應；既有任職的生效條件與待核對事項仍依原案。
#   - 新候選不直接填成現任；本檔有姓名也不代替任命效力與權限核對。
#   - 依有效結果更新 leader；終止時清空該職位，其他有效職位保留。
#   - 修改 contributors 依本人選擇及制度；不自動改 leader 或平台權限。
#   - 個人檔案或 role 改名時，同一 PR 更新所有有效引用，歷史由 Git 保存。
#   - 不直接用本檔替代案件固定投票名冊，不自動派發 Discord 角色。
# =============================================================================
